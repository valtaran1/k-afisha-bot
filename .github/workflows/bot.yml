name: News bot

on:
  schedule:
    - cron: "*/30 * * * *"   # каждые 30 минут (GitHub может запускать с задержкой)
  workflow_dispatch:          # кнопка "Run workflow" для ручного запуска

permissions:
  contents: write             # чтобы сохранять seen.json (список уже выложенных новостей)

concurrency:
  group: news-bot
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHANNEL: "@k_afiisha"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}   # необязательно, платно
          AI_PROVIDERS: gemini        # для ChatGPT: "openai,gemini"
          RUN_ONCE: "1"
          PYTHONUNBUFFERED: "1"       # показывать журнал сразу, а не в конце
          PAUSE_BETWEEN_POSTS: "120"
        run: python news_bot.py

      - name: Save seen.json
        if: always()
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add seen.json || true
          git diff --cached --quiet || (git commit -m "update seen" && git push)
