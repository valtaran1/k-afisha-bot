name: News bot

on:
  schedule:
    - cron: "*/15 * * * *"    # афиши: каждые 15 минут (GitHub иногда запускает с задержкой)
    - cron: "7 1 * * 1"       # сезонный обзор: понедельник ~10:07 по Корее
  workflow_dispatch:          # кнопка "Run workflow" для ручного запуска
    inputs:
      mode:
        description: "events — афиши, seasonal — сезонный обзор"
        default: "events"

permissions:
  contents: write             # чтобы сохранять seen.json (что уже обработано)

concurrency:
  group: news-bot
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main             # всегда свежий seen.json (иначе запуск из очереди берёт старый и повторяет посты)

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHANNEL: "@k_afiisha"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}   # поиск точного адреса площадки (Kakao Map)
          MODE: ${{ github.event.schedule == '7 1 * * 1' && 'seasonal' || inputs.mode || 'events' }}
          PYTHONUNBUFFERED: "1"
          PAUSE_BETWEEN_POSTS: "60"
        run: python news_bot.py

      - name: Save seen.json
        if: always()
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add seen.json || true
          git diff --cached --quiet || (git commit -m "update seen" && git pull --rebase -q && git push)
